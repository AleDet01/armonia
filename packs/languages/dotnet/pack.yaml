apiVersion: armonia/v1
kind: Pack
metadata:
  id: language/dotnet
  version: 1.0.0
  description: .NET SDK capability defaults.
compatibility:
  spec: ^1
requires:
  - id: core
    version: 1.0.0
provides:
  - language/dotnet
defaults:
  capabilities:
    setup:
      argv: [dotnet, restore, --locked-mode]
    format:
      argv: [dotnet, format, --verify-no-changes]
    test:
      argv: [dotnet, test, --no-restore]
    build:
      argv: [dotnet, build, --no-restore]
