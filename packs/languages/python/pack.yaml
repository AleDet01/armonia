apiVersion: armonia/v1
kind: Pack
metadata:
  id: language/python
  version: 1.0.0
  description: Conservative Python capability defaults; projects can override every command.
compatibility:
  spec: ^1
requires:
  - id: core
    version: 1.0.0
provides:
  - language/python
defaults:
  capabilities:
    setup:
      argv: [python, -m, pip, install, -e, ".[dev]"]
    lint:
      argv: [python, -m, ruff, check, .]
    test:
      argv: [python, -m, pytest]
    build:
      argv: [python, -m, build]
