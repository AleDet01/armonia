name: Reusable Armonia release

on:
  workflow_call:
    inputs:
      armonia-repository:
        description: Repository containing the Armonìa distribution.
        required: true
        type: string
      armonia-ref:
        description: Immutable Armonìa commit SHA.
        required: true
        type: string
      tag:
        description: Existing immutable tag to release.
        required: true
        type: string
      artifact-glob:
        description: Optional artifact glob passed to gh release upload.
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out caller tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: workspace

      - name: Check out Armonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.armonia-repository }}
          ref: ${{ inputs.armonia-ref }}
          path: runtime

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0

      - name: Validate
        working-directory: workspace
        run: node ../runtime/src/cli.ts validate .

      - name: Test and build
        working-directory: workspace
        run: node ../runtime/src/cli.ts ci .

      - name: Package
        working-directory: workspace
        run: node ../runtime/src/cli.ts run package

      - name: Create GitHub release
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_GLOB: ${{ inputs.artifact-glob }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          if [ -n "$ARTIFACT_GLOB" ]; then
            gh release upload "$RELEASE_TAG" $ARTIFACT_GLOB
          fi
