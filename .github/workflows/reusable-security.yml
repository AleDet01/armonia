name: Reusable Armonia security baseline

on:
  workflow_call:
    inputs:
      armonia-repository:
        description: Repository containing the Armonìa distribution.
        required: true
        type: string
      armonia-ref:
        description: Immutable Armonìa commit SHA.
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: workspace

      - name: Check out Armonia
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.armonia-repository }}
          ref: ${{ inputs.armonia-ref }}
          path: runtime

      - name: Evaluate supply-chain and repository policy
        working-directory: workspace
        run: node ../runtime/src/cli.ts validate .
