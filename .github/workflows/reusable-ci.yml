name: Reusable Armonia CI

on:
  workflow_call:
    inputs:
      armonia-repository:
        description: Repository containing the Armonìa distribution.
        required: true
        type: string
      armonia-ref:
        description: Immutable Armonìa commit SHA.
        required: true
        type: string
      manifest:
        description: Project manifest path.
        required: false
        default: .armonia/project.yaml
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workspace

      - name: Check out Armonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.armonia-repository }}
          ref: ${{ inputs.armonia-ref }}
          path: runtime

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0

      - name: Verify requested manifest
        shell: bash
        run: test -f "workspace/${{ inputs.manifest }}"

      - name: Validate contract and policy
        working-directory: workspace
        run: node ../runtime/src/cli.ts validate .

      - name: Run declared CI capabilities
        working-directory: workspace
        run: node ../runtime/src/cli.ts ci .
