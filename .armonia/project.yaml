apiVersion: "armonia/v1"
kind: "Project"
metadata:
  id: "armonia/framework"
  name: "Armonìa"
  description: "Language-independent repository governance and developer-experience framework."
  owners:
    - "AleDet01"
spec:
  lifecycle: "incubating"
  maturity: "prototype"
  criticality: "tier-3"
  profile: "baseline"
  visibility: "private"
  distribution:
    repository: "AleDet01/armonia"
    ref: "16d4b7846a40e1ce68aa7cb06f3884670d562701"
  packs:
    -
      id: "core"
      version: "1.0.0"
    -
      id: "language/typescript"
      version: "1.0.0"
    -
      id: "archetype/cli"
      version: "1.0.0"
    -
      id: "governance/open-source"
      version: "1.0.0"
  components:
    -
      id: "root"
      path: "."
      languages:
        - "typescript"
      capabilities:
        setup:
          argv:
            - "pnpm"
            - "install"
            - "--frozen-lockfile"
        lint:
          argv:
            - "node"
            - "--check"
            - "src/cli.ts"
        test:
          argv:
            - "node"
            - "--test"
            - "test/core.test.ts"
            - "test/cli.test.ts"
        build:
          argv:
            - "npm"
            - "pack"
            - "--dry-run"
        package:
          argv:
            - "npm"
            - "pack"
        verify:
          argv:
            - "pnpm"
            - "run"
            - "verify"
  github:
    defaultBranch: "main"
    issues: true
    releases: false
  ai:
    contextEntry: "AGENTS.md"
    generatedAdapters: []
